name: Run Sinko Index Pipeline

on:
  repository_dispatch:
    types: [gcp-cron, run-kcar-pipeline] # Triggered by Google Cloud Scheduler webhook
  workflow_dispatch: # Retained for manual testing in the GitHub UI

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Data Download Script
        run: python sinko_index_data_download.py

      - name: Commit and Push Input Data CSV to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sinko_index_input_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update downloaded Sinko Index input data [skip ci]" && git push)

      - name: Run Sinko Index Calculation Script
        run: python sinko_index_algorithm_run.py

      - name: Commit and Push Output Sinko Index Data CSV to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sinko_index_output_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update computed Sinko Index output data [skip ci]" && git push)

      - name: Commit and Push Generated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kcar_recent_obs.csv kcar_recent_obs_with_rh.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KCAR weather data [skip ci]" && git push)
